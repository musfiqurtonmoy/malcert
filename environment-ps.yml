# Environment for the problem-space check only (tools/ps_build.py): the EMBER v2 feature extractor
# with the LIEF version its authors verified for version-2 features on Windows (0.10.1).
#   conda env create -f environment-ps.yml
#   conda activate malcert-ps        (activate it: this Python needs the env's Library\bin on PATH)
# Python is 3.7 because LIEF 0.10.1 was published for Python 3.5-3.7 only.
# numpy < 1.24 and scikit-learn 1.0.x are required by the EMBER extractor as published.
# EMBER (AGPL-v3) is installed from its repository at a fixed commit, without its dependency pins
# (they would replace LIEF 0.10.1 by 0.9.0):
#   pip install --no-deps https://github.com/elastic/ember/archive/d97a0b523de02f3fe5ea6089d080abacab6ee931.zip
name: malcert-ps
channels:
  - conda-forge
dependencies:
  - python=3.7.12
  - pip=24.0
  - pip:
      - lief==0.10.1
      - numpy==1.21.6
      - scikit-learn==1.0.2
      - scipy==1.7.3
      - pandas==1.3.5
      - lightgbm==3.3.5
      - tqdm==4.68.2
      - joblib==1.3.2
      - threadpoolctl==3.1.0
      - python-dateutil==3.0.0
      - pytz==2026.6
      - six==1.17.0
      - colorama==0.4.6
